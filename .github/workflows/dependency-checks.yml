name: Dependency checks

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      audit_only:
        description: Retry the daily advisory scan without rebuilding PR environments
        required: false
        default: false
        type: boolean
      test_webhook:
        description: Send one Discord test message and skip dependency checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-checks
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test trusted maintenance code
        run: python3 -m unittest discover -s tests -v
      - name: Send Discord webhook test
        if: inputs.test_webhook == true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python3 scripts/check-dependency-prs.py --test-discord
      - name: Check eligible dependency updates
        if: inputs.test_webhook != true
        env:
          SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          READ_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN || secrets.DEPENDENCY_UPDATE_TOKEN || secrets.PRIVATE_SOURCE_READ_TOKEN }}
          STATUS_TOKEN: ${{ secrets.DEPENDENCY_STATUS_TOKEN || secrets.DEPENDENCY_UPDATE_TOKEN }}
          UPDATE_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECHECK: ${{ github.event_name == 'workflow_dispatch' }}
          AUDIT_ONLY: ${{ inputs.audit_only }}
        run: python3 scripts/check-dependency-prs.py
