name: Build iOS

on:
  workflow_dispatch:
    inputs:
      private_source_sha:
        description: Exact commit to build from the configured private repository (defaults to codex/ipa-queue)
        type: string
        required: false
      app_variant:
        description: Dev uses local sample data and simulation controls; Production uses live data with simulation controls disabled.
        type: choice
        required: false
        options: [dev, production]
        default: dev
      production_release_tag:
        description: Published non-prerelease source tag required for Production builds
        type: string
        required: false
      run_ui_tests:
        description: Run the full simulator suite before IPA delivery. Set false to build a private IPA for manual device testing without running tests.
        type: boolean
        required: false
        default: true
      deliver_private_ipa:
        description: Upload the unsigned IPA to a private release
        type: boolean
        required: false
        default: true
      sheet_style:
        description: Route sheet accent treatment for the private IPA
        type: choice
        required: false
        options: [accent-rail-gray-divider, colored-divider-only]
        default: colored-divider-only
      allow_failed_ui_tests_for_private_candidate:
        description: Allow a labeled private test candidate when the full simulator suite fails
        type: boolean
        required: false
        default: false
      test_suite:
        description: Simulator suite for test-only dispatches (IPA delivery always runs full)
        type: choice
        options: [full, sheets, picker, startup, map, gestures, ownership, ownership-check]
        default: full
permissions:
  contents: none

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.app_variant || 'dev' }}-${{ inputs.deliver_private_ipa && inputs.sheet_style || 'tests' }}
  cancel-in-progress: false

jobs:
  resolve_queue:
    name: Resolve source revision for the IPA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      auth_mode: ${{ steps.auth.outputs.auth_mode }}
    steps:
      - name: Check out versioned workflow scripts
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/broker"
          git -C "$RUNNER_TEMP/broker" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/broker" checkout --quiet --detach FETCH_HEAD

      - name: Validate private source authentication
        id: auth
        shell: bash
        env:
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          APP_CLIENT_ID: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY != '' }}
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN != '' }}
          UPLOAD_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN != '' }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/validate-private-source-authentication.sh"

      - name: Mint short-lived private source token
        id: source_app_token
        if: steps.auth.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: read

      - name: Resolve queued revision for this manual build
        id: resolve
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.private_source_sha }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          PRIVATE_SOURCE_READ_TOKEN: ${{ steps.auth.outputs.auth_mode == 'app' && steps.source_app_token.outputs.token || secrets.PRIVATE_SOURCE_READ_TOKEN }}
          APP_VARIANT: ${{ inputs.app_variant || 'dev' }}
          PRODUCTION_RELEASE_TAG: ${{ inputs.production_release_tag }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/resolve-queued-revision-for-this-manual-build.sh"

  full_test_map:
    name: UI tests (map)
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: map
      test_suite: full
      run_ui_tests: true
      run_contracts: true
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  full_test_visuals:
    name: UI tests (sheet visuals)
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: visuals
      test_suite: full
      run_ui_tests: true
      run_contracts: false
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  full_test_ownership:
    name: UI tests (sheet ownership)
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: ownership
      test_suite: full
      run_ui_tests: true
      run_contracts: false
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  full_test_gestures:
    name: UI tests (gestures and settings)
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: gestures
      test_suite: full
      run_ui_tests: true
      run_contracts: false
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  full_test_startup_picker:
    name: UI tests (startup and route picker)
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: startup-picker
      test_suite: full
      run_ui_tests: true
      run_contracts: false
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  focused_tests:
    name: Focused UI tests
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && !inputs.deliver_private_ipa && inputs.run_ui_tests && inputs.test_suite != 'full'
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: focused
      test_suite: ${{ inputs.test_suite }}
      run_ui_tests: true
      run_contracts: true
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  contracts_only:
    name: Swift contracts only
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && !inputs.deliver_private_ipa && !inputs.run_ui_tests
    uses: ./.github/workflows/ios-ui-test-shard.yml
    with:
      private_source_sha: ${{ needs.resolve_queue.outputs.revision }}
      app_client_id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
      auth_mode: ${{ needs.resolve_queue.outputs.auth_mode }}
      shard: contracts-only
      test_suite: full
      run_ui_tests: false
      run_contracts: true
    secrets:
      private_source_repository: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
      ios_project_directory: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      ios_scheme: ${{ secrets.IOS_SCHEME }}
      private_source_github_app_private_key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
      private_source_read_token: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
      private_ipa_upload_token: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN }}

  full_test_gate:
    name: Require all full-suite shards to pass
    if: always() && github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.run_ui_tests && (inputs.deliver_private_ipa || inputs.test_suite == 'full')
    needs:
      - resolve_queue
      - full_test_map
      - full_test_visuals
      - full_test_ownership
      - full_test_gestures
      - full_test_startup_picker
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.gate.outputs.test_result }}
    steps:
      - name: Verify every shard ran and authorize delivery
        id: gate
        shell: bash
        env:
          DELIVER_PRIVATE_IPA: ${{ inputs.deliver_private_ipa }}
          ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE: ${{ inputs.allow_failed_ui_tests_for_private_candidate }}
          MAP_RAN: ${{ needs.full_test_map.outputs.suite_ran }}
          MAP_RESULT: ${{ needs.full_test_map.outputs.test_outcome }}
          VISUALS_RAN: ${{ needs.full_test_visuals.outputs.suite_ran }}
          VISUALS_RESULT: ${{ needs.full_test_visuals.outputs.test_outcome }}
          OWNERSHIP_RAN: ${{ needs.full_test_ownership.outputs.suite_ran }}
          OWNERSHIP_RESULT: ${{ needs.full_test_ownership.outputs.test_outcome }}
          GESTURES_RAN: ${{ needs.full_test_gestures.outputs.suite_ran }}
          GESTURES_RESULT: ${{ needs.full_test_gestures.outputs.test_outcome }}
          STARTUP_PICKER_RAN: ${{ needs.full_test_startup_picker.outputs.suite_ran }}
          STARTUP_PICKER_RESULT: ${{ needs.full_test_startup_picker.outputs.test_outcome }}
        run: |
          for shard in MAP VISUALS OWNERSHIP GESTURES STARTUP_PICKER; do
            ran_var="${shard}_RAN"
            if [[ "${!ran_var}" != true ]]; then
              echo "::error title=Simulator suite incomplete::$shard did not produce a test result."
              exit 1
            fi
          done
          failed=false
          for shard in MAP VISUALS OWNERSHIP GESTURES STARTUP_PICKER; do
            result_var="${shard}_RESULT"
            if [[ "${!result_var}" != success ]]; then failed=true; fi
          done
          if [[ "$failed" == true ]]; then
            if [[ "$DELIVER_PRIVATE_IPA" == true && "$ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE" == true ]]; then
              echo "test_result=failure" >> "$GITHUB_OUTPUT"
              echo "::warning title=Private test candidate::At least one full-suite shard failed; the IPA will be labeled as a test candidate."
            else
              echo "::error title=Simulator test gate failed::All five full-suite shards must pass."
              exit 1
            fi
          else
            echo "test_result=success" >> "$GITHUB_OUTPUT"
          fi

  package_ipa:
    name: Package private IPA
    needs: [resolve_queue, full_test_gate]
    if: always() && github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true' && inputs.deliver_private_ipa && (inputs.run_ui_tests == false || needs.full_test_gate.result == 'success')
    runs-on: macos-26
    timeout-minutes: 55
    env:
      IOS_PROJECT_DIRECTORY: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      IOS_SCHEME: ${{ secrets.IOS_SCHEME }}
    steps:
      - name: Check out versioned workflow scripts
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/broker"
          git -C "$RUNNER_TEMP/broker" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/broker" checkout --quiet --detach FETCH_HEAD

      - name: Check private-release delivery configuration
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY != '' }}
          TOKEN_CONFIGURED: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN != '' }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/check-private-release-delivery-configuration.sh"

      - name: Mint short-lived private source read token
        id: source_app_token
        if: needs.resolve_queue.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: read

      - name: Mint short-lived private source write token
        id: upload_app_token
        if: needs.resolve_queue.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: write

      - name: Check out exact private source revision
        shell: bash
        env:
          REQUESTED_REVISION: ${{ needs.resolve_queue.outputs.revision }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          PRIVATE_SOURCE_READ_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.source_app_token.outputs.token || secrets.PRIVATE_SOURCE_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_TRACE: '0'
          GIT_TRACE_CURL: '0'
          GIT_CURL_VERBOSE: '0'
        run: bash "$RUNNER_TEMP/broker/scripts/ios/check-out-private-source-with-a-read-only-token.sh"

      - name: Restore private dependency cache
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/dependency-cache.sh" restore

      - name: Generate Xcode project and resolve pinned packages
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/generate-xcode-project-and-resolve-pinned-packages.sh"

      - name: Build and package unsigned arm64 IPA
        id: package
        shell: bash
        env:
          SENTRY_IOS_DSN: ${{ secrets.SENTRY_IOS_DSN }}
          SENTRY_ENVIRONMENT: ${{ inputs.app_variant == 'production' && 'production' || 'development' }}
          APP_VARIANT: ${{ inputs.app_variant || 'dev' }}
          KNIGHTROUTE_SHEET_STYLE: ${{ inputs.sheet_style }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/build-and-package-unsigned-arm64-ipa.sh"

      - name: Upload IPA to a private release
        id: private-release
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          SIMULATOR_TEST_RESULT: ${{ needs.full_test_gate.outputs.test_result }}
          ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE: ${{ inputs.allow_failed_ui_tests_for_private_candidate }}
          SHEET_STYLE: ${{ inputs.sheet_style }}
          APP_VARIANT: ${{ inputs.app_variant || 'dev' }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/upload-ipa-to-a-private-release.sh"

      - name: Upload filtered build diagnostics privately
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          XCRESULT_BUNDLE: ${{ runner.temp }}/ios-ui-tests.xcresult
          MATRIX_SHARD: package
        run: bash "$RUNNER_TEMP/broker/scripts/ios/upload-filtered-build-diagnostics-privately.sh"

      - name: Report failed simulator tests after candidate delivery
        if: always() && needs.full_test_gate.outputs.test_result == 'failure'
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/report-simulator-test-failure-after-private-delivery.sh"
