name: Build iOS

on:
  workflow_dispatch:
    inputs:
      private_source_sha:
        description: Exact commit to build from the configured private repository (defaults to codex/ipa-queue)
        type: string
        required: false
      run_ui_tests:
        description: Run simulator tests on a test-only dispatch (always run for IPA delivery)
        type: boolean
        required: false
        default: true
      deliver_private_ipa:
        description: Upload the unsigned IPA to a private release
        type: boolean
        required: false
        default: true
      allow_failed_ui_tests_for_private_candidate:
        description: Allow a labeled private test candidate when the full simulator suite fails
        type: boolean
        required: false
        default: false
      test_suite:
        description: Simulator suite for test-only dispatches (IPA delivery always runs full)
        type: choice
        options: [full, sheets, picker, startup, map, gestures, ownership]
        default: full
permissions:
  contents: none

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.deliver_private_ipa && 'ipa' || 'tests' }}
  cancel-in-progress: false

jobs:
  resolve_queue:
    name: Check for a new queued IPA revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      auth_mode: ${{ steps.auth.outputs.auth_mode }}
    steps:
      - name: Check out versioned workflow scripts
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/broker"
          git -C "$RUNNER_TEMP/broker" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/broker" checkout --quiet --detach FETCH_HEAD

      - name: Validate private source authentication
        id: auth
        shell: bash
        env:
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          APP_CLIENT_ID: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY != '' }}
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN != '' }}
          UPLOAD_TOKEN_CONFIGURED: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN != '' }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/validate-private-source-authentication.sh"

      - name: Mint short-lived private source token
        id: source_app_token
        if: steps.auth.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: read

      - name: Resolve queued revision for this manual build
        id: resolve
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.private_source_sha }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          PRIVATE_SOURCE_READ_TOKEN: ${{ steps.auth.outputs.auth_mode == 'app' && steps.source_app_token.outputs.token || secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/resolve-queued-revision-for-this-manual-build.sh"

  build:
    # workflow_dispatch can target another ref; never expose secrets off main.
    needs: resolve_queue
    if: github.ref == 'refs/heads/main' && needs.resolve_queue.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 55
    env:
      IOS_PROJECT_DIRECTORY: ${{ secrets.IOS_PROJECT_DIRECTORY }}
      IOS_SCHEME: ${{ secrets.IOS_SCHEME }}
      RUN_UI_TESTS: ${{ inputs.deliver_private_ipa || inputs.run_ui_tests }}
      DELIVER_PRIVATE_IPA: ${{ inputs.deliver_private_ipa }}

    steps:
      - name: Check out versioned workflow scripts
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/broker"
          git -C "$RUNNER_TEMP/broker" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/broker" checkout --quiet --detach FETCH_HEAD

      - name: Check private-release delivery configuration
        if: env.DELIVER_PRIVATE_IPA == 'true'
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY != '' }}
          TOKEN_CONFIGURED: ${{ secrets.PRIVATE_IPA_UPLOAD_TOKEN != '' }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/check-private-release-delivery-configuration.sh"

      - name: Mint short-lived private source read token
        id: source_app_token
        if: needs.resolve_queue.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: read

      - name: Mint short-lived private source write token
        id: upload_app_token
        if: needs.resolve_queue.outputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRIVATE_SOURCE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_SOURCE_GITHUB_APP_PRIVATE_KEY }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: write

      - name: Check out private source with a read-only token
        id: private-source
        shell: bash
        env:
          REQUESTED_REVISION: ${{ needs.resolve_queue.outputs.revision }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          PRIVATE_SOURCE_READ_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.source_app_token.outputs.token || secrets.PRIVATE_SOURCE_READ_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_TRACE: '0'
          GIT_TRACE_CURL: '0'
          GIT_CURL_VERBOSE: '0'
        run: bash "$RUNNER_TEMP/broker/scripts/ios/check-out-private-source-with-a-read-only-token.sh"

      - name: Restore private dependency cache
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/dependency-cache.sh" restore

      - name: Generate Xcode project and resolve pinned packages
        id: package-resolution
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/generate-xcode-project-and-resolve-pinned-packages.sh"

      - name: Save private dependency cache
        timeout-minutes: 5
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/dependency-cache.sh" save

      - name: Run independent Swift contracts
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/contracts.sh"

      - name: Run iOS Simulator UI tests
        id: simulator-tests
        if: env.RUN_UI_TESTS == 'true'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        env:
          TEST_SUITE: ${{ inputs.deliver_private_ipa && 'full' || inputs.test_suite }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/run-ios-simulator-ui-tests.sh"

      - name: Authorize IPA packaging from this run's simulator result
        id: ipa-test-gate
        if: env.DELIVER_PRIVATE_IPA == 'true'
        shell: bash
        env:
          CURRENT_TEST_RESULT: ${{ steps.simulator-tests.outcome }}
          SIMULATOR_SUITE_RAN: ${{ steps.simulator-tests.outputs.suite_ran }}
          ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE: ${{ inputs.allow_failed_ui_tests_for_private_candidate }}
        run: |
          if [[ "$SIMULATOR_SUITE_RAN" != true ]]; then
            echo "::error title=IPA packaging blocked::No simulator test result bundle was produced."
            exit 1
          fi
          if [[ "$CURRENT_TEST_RESULT" == success ]]; then
            echo "test_result=success" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_TEST_RESULT" == failure && "$ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE" == true ]]; then
            echo "test_result=failure" >> "$GITHUB_OUTPUT"
            echo "::warning title=Private test candidate::The IPA will be labeled as a test candidate because the full simulator suite failed."
          else
            echo "::error title=IPA packaging blocked::A passing full simulator suite is required unless the private test-candidate option is enabled."
            exit 1
          fi

      - name: Build and package unsigned arm64 IPA
        if: env.DELIVER_PRIVATE_IPA == 'true' && steps.ipa-test-gate.outcome == 'success'
        shell: bash
        env:
          SENTRY_IOS_DSN: ${{ secrets.SENTRY_IOS_DSN }}
          SENTRY_ENVIRONMENT: production
        run: bash "$RUNNER_TEMP/broker/scripts/ios/build-and-package-unsigned-arm64-ipa.sh"

      - name: Upload filtered build diagnostics privately
        if: failure() || steps.simulator-tests.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          XCRESULT_BUNDLE: ${{ runner.temp }}/ios-ui-tests.xcresult
        run: bash "$RUNNER_TEMP/broker/scripts/ios/upload-filtered-build-diagnostics-privately.sh"

      - name: Upload IPA to a private release
        id: private-release
        if: env.DELIVER_PRIVATE_IPA == 'true' && steps.ipa-test-gate.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ needs.resolve_queue.outputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.PRIVATE_IPA_UPLOAD_TOKEN }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPOSITORY }}
          SIMULATOR_TEST_RESULT: ${{ steps.ipa-test-gate.outputs.test_result }}
          ALLOW_FAILED_UI_TESTS_FOR_PRIVATE_CANDIDATE: ${{ inputs.allow_failed_ui_tests_for_private_candidate }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/upload-ipa-to-a-private-release.sh"

      - name: Report simulator test failure after private delivery
        if: always() && steps.simulator-tests.outcome == 'failure'
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/report-simulator-test-failure-after-private-delivery.sh"
