name: iOS UI test shard

on:
  workflow_call:
    inputs:
      private_source_sha:
        type: string
        required: true
      app_client_id:
        type: string
        required: true
      auth_mode:
        type: string
        required: true
      shard:
        type: string
        required: true
      test_suite:
        type: string
        required: true
      run_ui_tests:
        type: boolean
        required: true
      run_contracts:
        type: boolean
        required: true
    secrets:
      private_source_repository:
        required: true
      ios_project_directory:
        required: true
      ios_scheme:
        required: true
      private_source_github_app_private_key:
        required: false
      private_source_read_token:
        required: false
      private_ipa_upload_token:
        required: false
    outputs:
      suite_ran:
        description: Whether this shard produced an xcresult bundle
        value: ${{ jobs.shard.outputs.suite_ran }}
      test_outcome:
        description: XCTest step result for this shard
        value: ${{ jobs.shard.outputs.test_outcome }}

permissions:
  contents: none

jobs:
  shard:
    runs-on: macos-26
    timeout-minutes: 55
    outputs:
      suite_ran: ${{ steps.simulator-tests.outputs.suite_ran }}
      test_outcome: ${{ steps.simulator-tests.outcome }}
    env:
      IOS_PROJECT_DIRECTORY: ${{ secrets.ios_project_directory }}
      IOS_SCHEME: ${{ secrets.ios_scheme }}
    steps:
      - name: Check out versioned workflow scripts
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/broker"
          git -C "$RUNNER_TEMP/broker" fetch --quiet --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/broker" checkout --quiet --detach FETCH_HEAD

      - name: Mint short-lived private source read token
        id: source_app_token
        if: inputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.private_source_github_app_private_key }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: read

      - name: Mint short-lived private source write token
        id: upload_app_token
        if: inputs.auth_mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.private_source_github_app_private_key }}
          owner: maxinoin
          repositories: KnightRoute
          permission-contents: write

      - name: Check out exact private source revision
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.private_source_sha }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.private_source_repository }}
          PRIVATE_SOURCE_READ_TOKEN: ${{ inputs.auth_mode == 'app' && steps.source_app_token.outputs.token || secrets.private_source_read_token }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_TRACE: '0'
          GIT_TRACE_CURL: '0'
          GIT_CURL_VERBOSE: '0'
        run: bash "$RUNNER_TEMP/broker/scripts/ios/check-out-private-source-with-a-read-only-token.sh"

      - name: Restore private dependency cache
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.private_ipa_upload_token }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.private_source_repository }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/dependency-cache.sh" restore

      - name: Generate Xcode project and resolve pinned packages
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/generate-xcode-project-and-resolve-pinned-packages.sh"

      - name: Save private dependency cache
        if: inputs.shard == 'map' || inputs.shard == 'focused' || inputs.shard == 'contracts-only'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.private_ipa_upload_token }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.private_source_repository }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/dependency-cache.sh" save

      - name: Run independent Swift contracts
        id: swift-contracts
        if: inputs.run_contracts
        shell: bash
        run: bash "$RUNNER_TEMP/broker/scripts/ios/contracts.sh"

      - name: Run iOS Simulator UI test shard
        id: simulator-tests
        if: inputs.run_ui_tests
        continue-on-error: ${{ inputs.shard != 'focused' }}
        timeout-minutes: 45
        shell: bash
        env:
          TEST_SUITE: ${{ inputs.test_suite }}
          TEST_SHARD: ${{ inputs.shard }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/run-ios-simulator-ui-tests.sh"

      - name: Upload filtered build diagnostics privately
        if: failure() || steps.simulator-tests.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.auth_mode == 'app' && steps.upload_app_token.outputs.token || secrets.private_ipa_upload_token }}
          PRIVATE_SOURCE_REPOSITORY: ${{ secrets.private_source_repository }}
          XCRESULT_BUNDLE: ${{ runner.temp }}/ios-ui-tests.xcresult
          MATRIX_SHARD: ${{ inputs.shard }}
        run: bash "$RUNNER_TEMP/broker/scripts/ios/upload-filtered-build-diagnostics-privately.sh"
